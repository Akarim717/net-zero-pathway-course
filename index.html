<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning a Net-Zero Pathway for a Small Organisation</title>
<style>
  :root{
    --ink:#1c2b25;
    --ink-soft:#44554d;
    --paper:#faf8f2;
    --paper-raised:#ffffff;
    --line:#dcd6c6;
    --green-deep:#1f5c46;
    --green:#2f7d5e;
    --green-soft:#e4efe6;
    --amber:#b3701f;
    --amber-soft:#f7ecd9;
    --blue:#2a5f7a;
    --blue-soft:#e4eef2;
    --red:#a3402e;
    --red-soft:#f6e6e1;
    --radius:14px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(28,43,37,0.06), 0 6px 20px rgba(28,43,37,0.06);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  h1,h2,h3,h4{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.25;letter-spacing:-0.01px;}
  h1{font-size:1.9rem;margin:0 0 .3em;}
  h2{font-size:1.4rem;margin:1.6em 0 .5em;}
  h3{font-size:1.12rem;margin:1.3em 0 .4em;color:var(--green-deep);}
  h4{font-size:1rem;margin:1em 0 .3em;}
  p{margin:0 0 1em;}
  a{color:var(--green-deep);}
  ul,ol{padding-left:1.3em;}
  li{margin-bottom:.4em;}
  table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.95rem;}
  th,td{border:1px solid var(--line);padding:.55em .7em;text-align:left;vertical-align:top;}
  th{background:var(--green-soft);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;color:var(--green-deep);}
  tr:nth-child(even) td{background:rgba(0,0,0,0.015);}

  /* App shell */
  #app-shell{display:flex;min-height:100vh;}
  #topbar{
    position:fixed;top:0;left:0;right:0;height:56px;
    background:var(--green-deep);color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 1rem;z-index:40;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  #topbar .brand{display:flex;align-items:center;gap:.6em;font-weight:600;font-size:.95rem;}
  #topbar .brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#5fae87,#1f5c46);display:flex;align-items:center;justify-content:center;font-size:.85rem;}
  #topbar .progress-pill{background:rgba(255,255,255,0.14);border-radius:999px;padding:.35em .9em;font-size:.78rem;display:flex;align-items:center;gap:.5em;}
  #topbar .progress-pill .bar-track{width:90px;height:6px;background:rgba(255,255,255,0.25);border-radius:99px;overflow:hidden;}
  #topbar .progress-pill .bar-fill{height:100%;background:#a9e2c3;border-radius:99px;transition:width .3s ease;}
  #menu-toggle{display:none;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:.3em .6em;font-size:.85rem;cursor:pointer;}

  #sidebar{
    width:250px;flex-shrink:0;background:var(--paper-raised);
    border-right:1px solid var(--line);
    padding:72px 0 2rem;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    z-index:30;
  }
  #sidebar .nav-section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);padding:0 1.2rem;margin:1.1em 0 .5em;}
  .nav-item{
    display:flex;align-items:center;gap:.7em;padding:.6em 1.2rem;cursor:pointer;color:var(--ink-soft);
    font-size:.88rem;border-left:3px solid transparent;
  }
  .nav-item:hover{background:var(--green-soft);}
  .nav-item.active{background:var(--green-soft);color:var(--green-deep);border-left-color:var(--green-deep);font-weight:600;}
  .nav-item .num{
    width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0;
  }
  .nav-item.done .num{background:var(--green);color:#fff;}
  .nav-item.active .num{background:var(--green-deep);color:#fff;}
  .nav-item .label{flex:1;}
  .nav-item .tick{font-size:.8rem;color:var(--green);}

  #main{margin-left:250px;padding:88px 2.4rem 5rem;max-width:920px;}
  @media (max-width:880px){
    #sidebar{transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 30px rgba(0,0,0,.15);}
    #sidebar.open{transform:translateX(0);}
    #main{margin-left:0;padding:88px 1.1rem 5rem;}
    #menu-toggle{display:inline-block;}
  }
  @media (max-width:480px){
    #topbar .brand span.brand-text{display:none;}
    #topbar .progress-pill .bar-track{display:none;}
    #topbar{padding:0 .7rem;}
  }

  .eyebrow{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:.76rem;color:var(--green-deep);font-weight:700;margin-bottom:.4em;}
  .driving-q{font-size:1.15rem;color:var(--green-deep);font-style:italic;margin:.2em 0 1em;}

  /* ---------- Hero banner ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .fade-in{animation:none !important;} }
  .fade-in{animation:fadeUp .6s ease both;}
  .fade-in.d1{animation-delay:.08s;}
  .fade-in.d2{animation-delay:.16s;}
  .fade-in.d3{animation-delay:.24s;}

  .hero{
    position:relative;margin:0 0 2rem;border-radius:20px;overflow:hidden;
    background:linear-gradient(160deg,#1f5c46 0%,#2f7d5e 45%,#c98a3a 100%);
    box-shadow:0 10px 34px rgba(31,92,70,0.22);
    min-height:320px;
  }
  .hero-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .hero-scrim{position:absolute;inset:0;background:linear-gradient(0deg, rgba(15,30,24,0.72) 0%, rgba(15,30,24,0.42) 42%, rgba(15,30,24,0.08) 75%);}
  .hero-content{position:relative;z-index:2;padding:2.6rem 2.6rem 2.2rem;color:#fdfaf2;}
  .hero-eyebrow{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.74rem;font-weight:700;color:#d9f0e2;margin-bottom:.7em;display:flex;align-items:center;gap:.5em;}
  .hero-eyebrow .leaf{font-size:.9rem;}
  .hero h1{color:#fff;font-size:2.15rem;margin:0 0 .35em;text-shadow:0 2px 18px rgba(0,0,0,0.25);}
  .hero .hero-sub{font-size:1.12rem;color:#f3ead4;font-style:italic;margin:0 0 1.3em;max-width:640px;}
  .hero-cta-row{display:flex;gap:.8em;flex-wrap:wrap;}
  .hero .btn{box-shadow:0 6px 18px rgba(0,0,0,0.18);}
  .hero .btn.ghost-light{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.55);backdrop-filter:blur(2px);}
  .hero .btn.ghost-light:hover{background:rgba(255,255,255,0.22);}

  .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 2.2rem;box-shadow:var(--shadow);}
  .stat-cell{background:var(--paper-raised);padding:1.1em .8em;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .stat-cell .stat-num{font-size:1.5rem;font-weight:800;color:var(--green-deep);line-height:1.1;}
  .stat-cell .stat-label{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:.3em;}
  @media (max-width:700px){
    .stat-strip{grid-template-columns:repeat(2,1fr);}
    .hero-content{padding:2rem 1.3rem 1.7rem;}
    .hero h1{font-size:1.6rem;}
  }

  .section-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--green-soft);color:var(--green-deep);margin-right:.5em;flex-shrink:0;vertical-align:middle;}
  h2.with-icon{display:flex;align-items:center;gap:.2em;}

  .meta-row{display:flex;flex-wrap:wrap;gap:.6em;margin:.8em 0 1.6em;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .chip{background:var(--paper-raised);border:1px solid var(--line);border-radius:999px;padding:.32em .85em;font-size:.78rem;color:var(--ink-soft);}

  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem 1.5rem;margin:1.2em 0;box-shadow:var(--shadow);transition:box-shadow .2s ease, transform .2s ease;}
  .card.hoverable:hover{box-shadow:0 4px 8px rgba(28,43,37,0.08), 0 14px 28px rgba(28,43,37,0.1);transform:translateY(-2px);}
  .card.tight{padding:1rem 1.2rem;}
  .stage{margin:2.4em 0;padding-top:.2em;border-top:1px solid var(--line);}
  .stage:first-of-type{border-top:none;}
  .stage-label{display:flex;align-items:center;gap:.6em;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:1.6em 0 .6em;}
  .stage-label .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}

  .scenario{background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:1em 1.2em;margin:1em 0;}
  .scenario .quote-mark{font-size:1.3rem;color:var(--blue);font-family:Georgia,serif;}
  .callout{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:1em 1.2em;margin:1em 0;}
  .callout.good{background:var(--green-soft);border-left-color:var(--green);}
  .callout.data{background:#eef1f6;border-left-color:var(--blue);}

  .worked-example{background:#fbfaf5;border:1px dashed var(--line);border-radius:var(--radius);padding:1.3rem 1.4rem;margin:1.2em 0;}
  .worked-example .tag{display:inline-block;background:var(--green-deep);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:.25em .7em;border-radius:5px;margin-bottom:.6em;}

  .btn{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:inline-flex;align-items:center;gap:.5em;
    background:var(--green-deep);color:#fff;border:none;border-radius:var(--radius-sm);
    padding:.65em 1.3em;font-size:.92rem;font-weight:600;cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--green);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--paper-raised);color:var(--green-deep);border:1px solid var(--line);}
  .btn.secondary:hover{background:var(--green-soft);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:.7em;flex-wrap:wrap;margin:1.3em 0;}

  label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.82rem;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:.3em;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    width:100%;padding:.55em .7em;border:1px solid var(--line);border-radius:var(--radius-sm);
    font-size:.92rem;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:4.5em;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px;}
  .field{margin-bottom:1em;}
  .field .hint{font-size:.78rem;color:var(--ink-soft);margin-top:.3em;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1em;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1em;}
  @media (max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .checklist label{display:flex;align-items:flex-start;gap:.6em;font-weight:400;font-size:.94rem;color:var(--ink);margin-bottom:.55em;cursor:pointer;font-family:inherit;}
  .checklist input[type=checkbox]{width:auto;margin-top:.3em;accent-color:var(--green-deep);flex-shrink:0;}

  .quiz-q{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem 1.3rem;margin:1em 0;}
  .quiz-opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:.7em .9em;margin:.5em 0;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.9rem;color:var(--ink);transition:border-color .15s ease;}
  .quiz-opt:hover{border-color:var(--green);}
  .quiz-opt.correct{border-color:var(--green);background:var(--green-soft);}
  .quiz-opt.incorrect{border-color:var(--red);background:var(--red-soft);}
  .quiz-opt.disabled{cursor:default;}
  .quiz-feedback{margin-top:.7em;padding:.8em 1em;border-radius:var(--radius-sm);font-size:.88rem;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .quiz-feedback.correct{background:var(--green-soft);color:var(--green-deep);}
  .quiz-feedback.incorrect{background:var(--red-soft);color:var(--red);}

  .tool-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem;margin:1.2em 0;}
  .tool-panel .tool-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1em;flex-wrap:wrap;gap:.6em;}
  .tool-panel .tool-header h4{margin:0;}
  .small-btn{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.8rem;background:var(--green-soft);color:var(--green-deep);border:1px solid var(--green);border-radius:var(--radius-sm);padding:.4em .8em;cursor:pointer;}
  .small-btn.danger{background:var(--red-soft);color:var(--red);border-color:var(--red);}
  .remove-row{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;}

  .conf-badge{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.72rem;padding:.2em .55em;border-radius:5px;font-weight:700;}
  .conf-High{background:var(--green-soft);color:var(--green-deep);}
  .conf-Medium{background:var(--amber-soft);color:var(--amber);}
  .conf-Low{background:var(--red-soft);color:var(--red);}

  .bar-row{display:flex;align-items:center;gap:.7em;margin:.5em 0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.85rem;}
  .bar-row .bar-label{width:150px;flex-shrink:0;color:var(--ink-soft);}
  .bar-row .bar-track{flex:1;height:16px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .bar-row .bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-deep));}
  .bar-row .bar-val{width:90px;text-align:right;flex-shrink:0;font-weight:600;}

  .priority-High{color:var(--green-deep);font-weight:700;}
  .priority-Medium{color:var(--amber);font-weight:700;}
  .priority-Low{color:var(--red);font-weight:700;}

  .readiness{background:var(--green-deep);color:#fff;border-radius:var(--radius);padding:1.4rem 1.5rem;margin:2em 0 1em;}
  .readiness h3{color:#fff;margin-top:0;}
  .readiness ul{margin:0;}

  .roadmap-sheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:1.6rem;box-shadow:var(--shadow);}
  .roadmap-sheet table td, .roadmap-sheet table th{font-size:.86rem;}
  .roadmap-title{text-align:center;border-bottom:3px solid var(--green-deep);padding-bottom:.7em;margin-bottom:1em;}
  .roadmap-title h2{margin:0;color:var(--green-deep);}

  .journey-map{display:flex;justify-content:space-between;gap:.5em;margin:1.6em 0;flex-wrap:wrap;position:relative;}
  .journey-map::before{content:"";position:absolute;top:22px;left:12%;right:12%;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px);z-index:0;}
  .journey-step{flex:1;min-width:120px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;position:relative;z-index:1;}
  .journey-step .circle{width:44px;height:44px;border-radius:50%;background:var(--paper-raised);color:var(--green-deep);display:flex;align-items:center;justify-content:center;margin:0 auto .4em;font-weight:700;border:2px solid var(--green);transition:all .2s ease;}
  .journey-step.active .circle{background:var(--amber);color:#fff;border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-soft);}
  .journey-step.done .circle{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
  .journey-step .jtitle{font-size:.82rem;font-weight:600;}
  .journey-step .jartefact{font-size:.74rem;color:var(--ink-soft);}

  .rubric-row{display:grid;grid-template-columns:1fr 2fr auto;gap:1em;align-items:center;padding:.8em 0;border-bottom:1px solid var(--line);}
  .rubric-row:last-child{border-bottom:none;}
  .rubric-toggle{display:flex;gap:.4em;}
  .rubric-toggle button{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.78rem;padding:.35em .7em;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .rubric-toggle button.sel-achieved{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
  .rubric-toggle button.sel-revise{background:var(--amber);color:#fff;border-color:var(--amber);}

  footer.course-footer{margin-top:4em;padding-top:1.5em;border-top:1px solid var(--line);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.8rem;color:var(--ink-soft);}

  @media print{
    #topbar,#sidebar,#menu-toggle,.no-print{display:none !important;}
    #main{margin-left:0;padding:0;max-width:100%;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<div id="topbar">
  <div style="display:flex;align-items:center;gap:.8em;">
    <button id="menu-toggle" class="no-print">&#9776;</button>
    <div class="brand"><div class="mark">&#127793;</div> <span class="brand-text">Planning a Net-Zero Pathway</span></div>
  </div>
  <div class="progress-pill">
    <span id="topbar-progress-label">0% complete</span>
    <div class="bar-track"><div class="bar-fill" id="topbar-progress-fill" style="width:0%"></div></div>
  </div>
</div>

<div id="app-shell">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   PLANNING A NET-ZERO PATHWAY FOR A SMALL ORGANISATION
   Self-instructional course web app (single-file)
   ============================================================ */

/* ---------- Emission factor defaults (used by the Module 2 calculator) ----------
   Electricity: Grid Emission Factor (GEF) Peninsular Malaysia, 2024 (provisional),
     Suruhanjaya Tenaga / Energy Commission Malaysia, "Grid Emission Factor (GEF)
     in Malaysia, 2022-2024 (Provisional)" = 0.740 tCO2e/MWh = 0.740 kg CO2e/kWh.
   Petrol / Diesel: UK DEFRA/DESNZ 2026 Greenhouse Gas Conversion Factors,
     average biofuel blend, litres basis. Used here as a widely referenced
     international default where a learner's own national fuel factor is not
     yet to hand.
   Business flights / Waste: illustrative defaults only, clearly flagged as
     Low confidence placeholders in the tool itself, because both vary hugely
     with route, aircraft and waste-treatment method.
------------------------------------------------------------------------------- */
const EMISSION_FACTORS = {
  electricity: { label: "Grid electricity", unit: "kWh", factor: 0.740, factorUnit: "kg CO2e/kWh",
    source: "Grid Emission Factor (GEF) Peninsular Malaysia, 2024 provisional — Suruhanjaya Tenaga (Energy Commission Malaysia)", defaultConfidence: "Medium" },
  petrol: { label: "Petrol (vehicles)", unit: "litres", factor: 2.075, factorUnit: "kg CO2e/litre",
    source: "UK DEFRA/DESNZ 2026 GHG Conversion Factors, average biofuel blend", defaultConfidence: "Medium" },
  diesel: { label: "Diesel (vehicles/generators)", unit: "litres", factor: 2.584, factorUnit: "kg CO2e/litre",
    source: "UK DEFRA/DESNZ 2026 GHG Conversion Factors, average biofuel blend", defaultConfidence: "Medium" },
  flights: { label: "Business flights", unit: "passenger-km", factor: 0.150, factorUnit: "kg CO2e/passenger-km",
    source: "Illustrative short/medium-haul average — replace with an airline or route-based calculator for real reporting", defaultConfidence: "Low" },

function renderChecklist(items, idPrefix){
  return `<div class="checklist">` + items.map((label, i) => {
    const id = idPrefix + "-" + i;
    const checked = state.checklists[id] ? "checked" : "";
    return `<label><input type="checkbox" ${checked} onchange="state.checklists['${id}']=this.checked;"> <span>${label}</span></label>`;

}

/* Quiz component: quiz = { question, options:[{text, correct, feedback}], scenario? } */
function renderQuiz(quiz, id){
  const answered = state.quizAnswers[id] !== undefined;
  const chosen = state.quizAnswers[id];
  let optsHtml = quiz.options.map((opt, i) => {
    let cls = "quiz-opt";
    if(answered){
      cls += " disabled";
      if(i === chosen && opt.correct) cls += " correct";
      else if(i === chosen && !opt.correct) cls += " incorrect";
      else if(opt.correct) cls += " correct";
    }
    return `<button class="${cls}" ${answered?"disabled":""} onclick="answerQuiz('${id}', ${i})">${esc(opt.text)}</button>`;
  }).join("");
  let feedbackHtml = "";
  if(answered){
    const opt = quiz.options[chosen];
    feedbackHtml = `<div class="quiz-feedback ${opt.correct?"correct":"incorrect"}">${opt.feedback}</div>`;
  }
  return `<div class="quiz-q" id="quizwrap-${id}">
    <p style="margin-bottom:.7em;"><strong>${quiz.question}</strong></p>
    ${optsHtml}
    ${feedbackHtml}
  </div>`;
}

function answerQuiz(id, i){
  state.quizAnswers[id] = i;
  const quiz = window.__quizLookup[id];
  const wrap = document.getElementById("quizwrap-" + id);
  wrap.outerHTML = renderQuiz(quiz, id);
}
window.__quizLookup = {}; // populated as each renderQuiz call is made, see registerQuiz()
function registerQuiz(quiz, id){ window.__quizLookup[id] = quiz; return renderQuiz(quiz, id); }

  if(toolName === "roadmap") return renderRoadmapTool();
  return "";
}

/* ============================================================
   TOOL 2 — CARBON BASELINE CALCULATOR  (Module 2)
   ============================================================ */
function ensureBaselineRows(){
  if(state.baseline.rows.length === 0){
    ["electricity","petrol","diesel","flights","waste"].forEach(key => {
      const ef = EMISSION_FACTORS[key];
      state.baseline.rows.push({
        id: uid("row"), categoryKey: key, customLabel: "",
        activityData: "", unit: ef.unit, factor: ef.factor, confidence: ef.defaultConfidence
      });
    });
  }
}

function baselineRowEmissions(row){
  const ad = parseFloat(row.activityData);
  if(isNaN(ad)) return 0;
  return (ad * row.factor) / 1000; // kg -> tonnes CO2e
}

function renderBaselineTool(){
  ensureBaselineRows();
  const rows = state.baseline.rows;
  const total = rows.reduce((sum, r) => sum + baselineRowEmissions(r), 0);

  const rowsHtml = rows.map(r => {
    const ef = EMISSION_FACTORS[r.categoryKey];
    const label = r.categoryKey === "custom" ? r.customLabel : ef.label;
    const emissions = baselineRowEmissions(r);
    return `<tr>
      <td style="min-width:170px;">
        ${r.categoryKey === "custom"
          ? `<input type="text" value="${esc(r.customLabel)}" placeholder="Category name" onchange="updateBaselineRow('${r.id}','customLabel',this.value)">`
          : `<strong>${esc(label)}</strong>`}
      </td>
      <td style="min-width:110px;"><input type="number" min="0" step="any" value="${esc(r.activityData)}" placeholder="0"
          onchange="updateBaselineRow('${r.id}','activityData',this.value)"></td>
      <td style="min-width:90px;">${esc(r.unit)}</td>
      <td style="min-width:130px;"><input type="number" min="0" step="any" value="${esc(r.factor)}"
          onchange="updateBaselineRow('${r.id}','factor',this.value)">
          <div class="field hint" style="margin-top:.2em;">kg CO2e/unit</div></td>
      <td style="min-width:120px;">
        <select onchange="updateBaselineRow('${r.id}','confidence',this.value)">
          ${["High","Medium","Low"].map(c => `<option value="${c}" ${r.confidence===c?"selected":""}>${c}</option>`).join("")}
        </select>
      </td>
      <td style="text-align:right;font-weight:700;min-width:100px;">${fmt(emissions,2)} t</td>
      <td><button class="remove-row" onclick="removeBaselineRow('${r.id}')" title="Remove row">&#10005;</button></td>
    </tr>
    <tr><td colspan="7" style="border-top:none;padding-top:0;"><span class="field hint">${esc(ef.source)}</span></td></tr>`;
  }).join("");

  return `<div class="tool-panel">
    <div class="tool-header"><h4>Carbon Baseline Calculator</h4>
      <button class="small-btn" onclick="addBaselineRow()">+ Add another activity</button>
    </div>
    <div style="overflow-x:auto;">
    <table>
      <tr><th>Activity</th><th>Activity data</th><th>Unit</th><th>Emission factor</th><th>Confidence</th><th style="text-align:right;">Emissions</th><th></th></tr>
      ${rowsHtml}
    </table>
    </div>
    <div class="card" style="background:var(--green-soft);border-color:var(--green);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;">
        <strong style="font-size:1.05rem;">Estimated total baseline footprint</strong>
        <span style="font-size:1.5rem;font-weight:700;color:var(--green-deep);">${fmt(total,2)} tCO2e</span>
      </div>
    </div>
    <h4>Where your emissions are coming from</h4>
    <div id="baseline-bars"></div>
    <p class="field hint">Emission factors are pre-filled with published defaults where available (see the source note under each row) but every figure is editable &mdash; if you have a verified factor for your own country, fuel supplier or waste contractor, use it and mark that row High confidence.</p>
  </div>`;
}

function addBaselineRow(){
  state.baseline.rows.push({ id: uid("row"), categoryKey:"custom", customLabel:"", activityData:"", unit:"units", factor:1, confidence:"Low" });
  render();
}
function removeBaselineRow(id){
  state.baseline.rows = state.baseline.rows.filter(r => r.id !== id);
  render();
}
function updateBaselineRow(id, field, value){
  const row = state.baseline.rows.find(r => r.id === id);
  if(!row) return;
  if(field === "activityData" || field === "factor") row[field] = value;
  else row[field] = value;
  render();
}

function renderBaselineBars(){
  const el = document.getElementById("baseline-bars");
  if(!el) return;
  const rows = state.baseline.rows
    .map(r => ({ label: r.categoryKey==="custom" ? (r.customLabel||"Custom") : EMISSION_FACTORS[r.categoryKey].label, val: baselineRowEmissions(r) }))
    .filter(r => r.val > 0)
    .sort((a,b) => b.val - a.val);
  if(rows.length === 0){ el.innerHTML = `<p class="field hint">Enter activity data above to see your top sources.</p>`; return; }
  const max = rows[0].val;
  el.innerHTML = rows.map(r => `<div class="bar-row">
    <div class="bar-label">${esc(r.label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(r.val/max)*100)}%;"></div></div>
    <div class="bar-val">${fmt(r.val,2)} t</div>
  </div>`).join("");
}

/* ============================================================
   TOOL 3 — CARBON ACTION PRIORITISATION MATRIX  (Module 3)
   ============================================================ */
const SCALE_IMPACT = {"High":3,"Medium":2,"Low":1};
const SCALE_COST = {"Low":3,"Medium":2,"High":1.5,"Very high":1};
const SCALE_FEASIBILITY = {"High":3,"Medium":2,"Low":1};
const SCALE_TIME = {"Short":3,"Medium":2,"Long":1};

function actionScore(a){
  return (SCALE_IMPACT[a.impact]||0) + (SCALE_COST[a.cost]||0) + (SCALE_FEASIBILITY[a.feasibility]||0) + (SCALE_TIME[a.time]||0);
}
function actionPriorityLabel(score){
  if(score >= 9) return "High";
  if(score >= 6) return "Medium";
  return "Low";
}

function ensureActionRows(){
  if(state.actions.rows.length === 0){
    ["LED lighting upgrade","Optimise HVAC settings and schedule","Rooftop solar PV"].forEach(name => {
      state.actions.rows.push({ id: uid("act"), name, impact:"Medium", cost:"Medium", feasibility:"Medium", time:"Medium", rationale:"" });
    });
  }
}

function renderActionsTool(){
  ensureActionRows();
  const rows = state.actions.rows;
  const selected = state.actions.selectedIds;

  const rowsHtml = rows.map(a => {
    const score = actionScore(a);
    const priority = actionPriorityLabel(score);
    const isSel = selected.includes(a.id);
    return `<tr>
      <td style="min-width:190px;"><input type="text" value="${esc(a.name)}" placeholder="Action name" onchange="updateActionRow('${a.id}','name',this.value)"></td>
      ${["impact","cost","feasibility","time"].map(field => {
        const opts = field==="cost" ? ["Low","Medium","High","Very high"] : (field==="time" ? ["Short","Medium","Long"] : ["High","Medium","Low"]);
        return `<td style="min-width:110px;"><select onchange="updateActionRow('${a.id}','${field}',this.value)">
          ${opts.map(o => `<option value="${o}" ${a[field]===o?"selected":""}>${o}</option>`).join("")}
        </select></td>`;
      }).join("")}
      <td style="text-align:center;"><span class="priority-${priority}">${priority}</span></td>
      <td style="text-align:center;">
        <input type="checkbox" style="width:auto;" ${isSel?"checked":""} ${(!isSel && selected.length>=3)?"disabled":""}
          onchange="toggleActionSelect('${a.id}', this.checked)" title="Select as one of your three priority actions">
      </td>
      <td><button class="remove-row" onclick="removeActionRow('${a.id}')">&#10005;</button></td>
    </tr>
    <tr><td colspan="8" style="border-top:none;padding-top:0;">
      <input type="text" style="font-size:.85rem;" value="${esc(a.rationale)}" placeholder="Rationale: why this score, and why act now or later?"
        onchange="updateActionRow('${a.id}','rationale',this.value)">
    </td></tr>`;
  }).join("");

  return `<div class="tool-panel">
    <div class="tool-header"><h4>Carbon Action Prioritisation Matrix</h4>
      <button class="small-btn" onclick="addActionRow()">+ Add another action</button>
    </div>
    <div style="overflow-x:auto;">
    <table>
      <tr><th>Action</th><th>Carbon impact</th><th>Cost</th><th>Feasibility</th><th>Time</th><th>Priority</th><th>Select top 3</th><th></th></tr>
      ${rowsHtml}
    </table>
    </div>
    <p class="field hint">Priority is calculated from impact, cost, feasibility and implementation time together &mdash; not carbon impact alone, so a high-impact but very expensive, low-feasibility action will not automatically rank top. Tick the checkbox on your three chosen priority actions; these carry forward into your Module 4 roadmap.</p>
    <p class="field hint">Selected so far: ${selected.length} / 3</p>
  </div>`;
}

function addActionRow(){
  state.actions.rows.push({ id: uid("act"), name:"", impact:"Medium", cost:"Medium", feasibility:"Medium", time:"Medium", rationale:"" });
  render();
}
function removeActionRow(id){
  state.actions.rows = state.actions.rows.filter(a => a.id !== id);
  state.actions.selectedIds = state.actions.selectedIds.filter(sid => sid !== id);
  render();
}
function updateActionRow(id, field, value){
  const row = state.actions.rows.find(a => a.id === id);
  if(!row) return;
  row[field] = value;
  render();
}
function toggleActionSelect(id, checked){
  if(checked){
    if(state.actions.selectedIds.length < 3) state.actions.selectedIds.push(id);
  } else {
    state.actions.selectedIds = state.actions.selectedIds.filter(sid => sid !== id);
  }
  render();
}

/* ============================================================
   TOOL 4 — ONE-PAGE NET-ZERO ROADMAP  (Module 4)
   ============================================================ */
function renderRoadmapTool(){
  const baselineTotal = state.baseline.rows.reduce((sum,r) => sum + baselineRowEmissions(r), 0);
  const hotspots = state.baseline.rows
    .map(r => ({ label: r.categoryKey==="custom" ? (r.customLabel||"Custom") : EMISSION_FACTORS[r.categoryKey].label, val: baselineRowEmissions(r) }))
    .filter(r => r.val > 0).sort((a,b)=>b.val-a.val).slice(0,3);

  const selectedActions = state.actions.rows.filter(a => state.actions.selectedIds.includes(a.id));
  const rm = state.roadmap;

  const actionCards = selectedActions.length ? selectedActions.map((a,i) => {
    const detail = rm.actionDetails[a.id] || { cost:"", timeline:"" };
    return `<tr>
      <td><strong>Priority Action ${i+1}</strong><br>${esc(a.name)}</td>
      <td>${actionPriorityLabel(actionScore(a))} impact / ${esc(a.cost)} cost / ${esc(a.feasibility)} feasibility</td>
      <td><input type="text" placeholder="e.g. RM 8,000" value="${esc(detail.cost)}" onchange="updateRoadmapActionDetail('${a.id}','cost',this.value)"></td>
      <td><input type="text" placeholder="e.g. 3 months" value="${esc(detail.timeline)}" onchange="updateRoadmapActionDetail('${a.id}','timeline',this.value)"></td>
    </tr>`;
  }).join("") : `<tr><td colspan="4" style="text-align:center;color:var(--ink-soft);">Go back to Module 3 and select up to three priority actions &mdash; they will appear here automatically.</td></tr>`;

  return `<div class="tool-panel no-print">
    <div class="tool-header"><h4>One-Page Net-Zero Roadmap builder</h4>
      <button class="btn secondary" onclick="window.print()">&#128438; Print / save as PDF</button>
    </div>

    <div class="roadmap-sheet" id="roadmap-sheet">
      <div class="roadmap-title">
        <h2>Net-Zero Roadmap</h2>
        <p style="margin:0;color:var(--ink-soft);">${esc(state.boundary.orgName) || "[ Organisation name &mdash; complete in Module 1 ]"} &middot; ${esc(state.boundary.period) || "[ reporting period ]"}</p>
      </div>

      <table>
        <tr><th style="width:32%;">Baseline</th><td>Estimated current footprint: <strong>${fmt(baselineTotal,2)} tCO2e</strong></td></tr>
        <tr><th>Hotspots</th><td>${hotspots.length ? hotspots.map(h=>`${esc(h.label)} (${fmt(h.val,2)} t)`).join(", ") : "[ complete Module 2 to populate ]"}</td></tr>
      </table>

      <h4 style="margin-top:1.3em;">Priority actions</h4>
      <table>
        <tr><th>Action</th><th>Basis</th><th>Indicative cost</th><th>Timeline</th></tr>
        ${actionCards}
      </table>

      <div class="field" style="margin-top:1.2em;"><label>Longer-term direction (next-stage interventions beyond these three actions)</label>
        <textarea onchange="state.roadmap.longerTerm=this.value;">${esc(rm.longerTerm)}</textarea>
      </div>

      <div class="field"><label>Monitoring indicators (2&ndash;4)</label>
        <div class="grid-2">
          ${[0,1,2,3].map(i => `<input type="text" placeholder="Indicator ${i+1}" value="${esc(rm.monitoring[i]||"")}" onchange="updateRoadmapMonitoring(${i}, this.value)" style="margin-bottom:.5em;">`).join("")}
        </div>
      </div>

      <div class="field"><label>Review point &mdash; when progress will be reassessed</label>
        <input type="text" placeholder="e.g. Q2 next year, at the next management review" value="${esc(rm.reviewPoint)}" onchange="state.roadmap.reviewPoint=this.value;">
      </div>
    </div>
  </div>`;
}

function updateRoadmapActionDetail(actionId, field, value){
  if(!state.roadmap.actionDetails[actionId]) state.roadmap.actionDetails[actionId] = { cost:"", timeline:"" };
  state.roadmap.actionDetails[actionId][field] = value;
}
function updateRoadmapMonitoring(i, value){
  state.roadmap.monitoring[i] = value;
}

  scenario: {
    quote: "You have your boundary map from Module 1. Now the facilities manager at Greenfield Training Centre has to turn a folder of bills, receipts and rough estimates into one defensible number.",
    note: "This is the module where carbon accounting stops being an abstract idea and becomes arithmetic you can actually check. The good news is that the arithmetic itself is simple. The skill is being honest about what you know precisely and what you are estimating."
  },
  concepts: [
    { heading: "The central relationship: Activity Data &times; Emission Factor = Estimated Emissions",
      body: `<p>Almost every carbon calculation you will ever do, in this course or beyond it, comes down to one multiplication.</p>
      <div class="callout" style="text-align:center;font-size:1.1rem;font-weight:700;color:var(--amber);">Activity Data &times; Emission Factor = Estimated Emissions</div>
      <p><strong>Activity data</strong> is how much of something happened: 85,000 kilowatt-hours of electricity, 2,400 litres of petrol. An <strong>emission factor</strong> converts one unit of that activity into a mass of greenhouse gas, expressed in kilograms or tonnes of carbon dioxide equivalent per unit. Multiply the two together and you have an estimated emission figure for that activity. Do this for every source in your boundary and sum the results, and you have a baseline.</p>` },
    { heading: "Why CO2e (carbon dioxide equivalent)?",
      body: `<p>Different greenhouse gases trap heat with very different potency. A kilogram of methane or refrigerant gas is not equivalent to a kilogram of carbon dioxide in its warming effect. <strong>CO2e</strong> converts every gas onto one common scale, based on its warming potential relative to CO2, so that a mixed bag of electricity, fuel and refrigerant emissions can be added together into one meaningful total. Every emission factor in this course, and in virtually every published dataset you will use in future, is already expressed in CO2e terms.</p>` },
    { heading: "Data quality: you do not need false precision",
      body: `<p>A first carbon footprint does not need to pretend to have laboratory-grade accuracy. What it needs is transparency about where each number came from. For every activity you calculate, classify your confidence as <strong>High</strong> (an actual measured record, such as a metered utility bill), <strong>Medium</strong> (a reasonable organisational estimate, such as fuel spend divided by an average price per litre) or <strong>Low</strong> (a proxy or assumption, such as an industry-average waste figure applied to your headcount). This is not a weakness in your work. It is exactly the kind of honesty a credible first pathway requires, and it tells your future self, or an auditor, exactly where to focus effort on improving the data next time.</p>` }
  ],
  workedExample: `<p>Greenfield Training Centre's facilities manager pulled together the following activity data for the last full year:</p>
    <table>
      <tr><th>Source</th><th>Activity data</th><th>Emission factor</th><th>Estimated emissions</th></tr>
      <tr><td>Grid electricity</td><td>85,000 kWh</td><td>0.740 kg CO2e/kWh</td><td><strong>62.90 tCO2e</strong></td></tr>
      <tr><td>Petrol (minibuses)</td><td>2,400 litres</td><td>2.075 kg CO2e/litre</td><td><strong>4.98 tCO2e</strong></td></tr>
      <tr><td>Diesel (generator)</td><td>1,100 litres</td><td>2.584 kg CO2e/litre</td><td><strong>2.84 tCO2e</strong></td></tr>
      <tr><td>Business flights</td><td>18,000 passenger-km (from travel records)</td><td>0.150 kg CO2e/passenger-km</td><td><strong>2.70 tCO2e</strong></td></tr>
      <tr><td>Waste (estimated)</td><td>8 tonnes/year</td><td>450 kg CO2e/tonne</td><td><strong>3.60 tCO2e</strong></td></tr>
      <tr><td colspan="3" style="text-align:right;"><strong>Total baseline</strong></td><td><strong>77.02 tCO2e</strong></td></tr>
    </table>
    <p>Notice what the arithmetic reveals immediately: grid electricity is not just the largest source, it dwarfs everything else combined, at roughly 82% of the total. Petrol and waste are a distant second and third. This single observation, produced by nothing more complicated than five multiplications and a sum, already tells Greenfield almost everything it needs to know about where to focus in Module 3.</p>
    <p>The facilities manager also recorded her confidence in each figure: <strong>High</strong> for electricity and petrol, since both come from metered bills and fuel receipts; <strong>Medium</strong> for diesel, based on generator run-hours rather than a direct meter; and <strong>Low</strong> for flights and waste, since both rely on estimates rather than measured records. That is a perfectly credible first baseline.</p>`,
  guidedActivityIntro: `<p>Use the calculator below to build your own baseline. The standard categories are pre-filled with default emission factors so you are not starting from a blank spreadsheet &mdash; enter your own activity data, adjust any factor you have a better local figure for, and rate your confidence in each line honestly.</p>`,
  tool: "baseline",
  selfCheck: [
    { question: "Organisation A has very high electricity use but no company vehicles. Organisation B has moderate electricity use but a large diesel fleet. Would the same reduction strategy make sense for both?",
      options: [
        { text: "Yes, both should start with rooftop solar, since renewable electricity is always the best first step.", correct:false, feedback: "Not necessarily. Solar addresses Organisation A's dominant source directly, but for Organisation B, where the diesel fleet may be the larger share of the footprint, solar would leave the actual hotspot almost untouched. A reduction strategy has to follow the baseline, not a general assumption about what &ldquo;good&rdquo; looks like." },
        { text: "No. Organisation A's baseline is dominated by electricity, so efficiency and renewable procurement matter most there, while Organisation B's baseline is dominated by fuel, so fleet-related actions matter most there.", correct:true, feedback: "Correct. This is exactly the point of building a baseline before jumping to actions. The same generic advice, such as &ldquo;go solar&rdquo; or &ldquo;switch to electric vehicles,&rdquo; will have completely different impact depending on where each organisation's emissions actually sit. Module 3 builds directly on this logic." },
        { text: "It depends only on which organisation has more money to spend.", correct:false, feedback: "Cost is one factor in Module 3's prioritisation matrix, but it is not the deciding factor here. The more fundamental issue is that the two organisations have different emission profiles, so the same action would have very different carbon impact for each of them regardless of budget." }
      ] }
  ],
  recovery: `If your numbers are not adding up, or you are unsure whether you have applied a factor correctly, work through it in this order: re-read the worked example above line by line, check that your activity data and emission factor are both in matching units (for example, do not mix litres and kilograms), and confirm you have divided by 1,000 if your factor is in kilograms but you want a result in tonnes. If you are still stuck, try re-entering Greenfield's own figures into the calculator above and check you can reproduce 77.02 tCO2e before returning to your own data.`,
  reflection: { prompts: [
    "Which of your baseline figures are you most confident in, and which would you flag as needing improvement before you would present this to management?",
    "Did anything in your own baseline surprise you, in the way that electricity dominating Greenfield's total might surprise someone who assumed vehicle fuel would be the biggest source?"
  ]},
  output: { title: "Baseline Carbon Footprint", description: "Your total estimated footprint, a breakdown by emission category, your top three sources by size, and the confidence rating and assumptions behind each figure. This is the evidence base for everything in Module 3." }
});

/* ============================================================
   MODULE 3 CONTENT — Find and Prioritise Reduction Opportunities
   ============================================================ */
courseData.modules.push({
  id: "m3", number: 3, title: "Find and Prioritise Reduction Opportunities", slt: "4.5 hours",
  drivingQuestion: "What should we tackle first?",
  outcome: "identify and evaluate practical carbon-reduction opportunities and select three priority actions.",
  keyConcepts: "carbon hotspot, reduction potential, implementation cost, operational feasibility, payback considerations, implementation time and co-benefits.",
  scenario: {
    quote: "Greenfield now knows that grid electricity is roughly 82% of its footprint. Knowing that is not the same as knowing what to do about it.",
    note: "This is where the course shifts from carbon accounting to decision-making, and it is arguably the module where a good plan and a wish list part ways. A wish list ranks actions by how green they sound. A plan ranks them by impact, cost, feasibility and time, together."
  },
  concepts: [
    { heading: "A carbon hotspot is not automatically the right first move",
      body: `<p>Your baseline tells you where the emissions are. It does not automatically tell you where to act first. A <strong>carbon hotspot</strong>, the largest source in your baseline, is the natural place to start looking, but the actual best first action depends on more than size alone: how much of that hotspot a given action can realistically reduce (its <strong>reduction potential</strong>), how much it costs to implement, how operationally <strong>feasible</strong> it is given your constraints, how long it takes, and what other benefits it might bring alongside the carbon reduction, known as <strong>co-benefits</strong> (lower running costs, improved comfort, better staff retention, and so on).</p>` },
    { heading: "Four dimensions, not one",
      body: `<p>Every action you consider in this module gets scored on four dimensions, not just carbon impact: <strong>Impact</strong> (how much of your footprint this genuinely addresses), <strong>Cost</strong> (capital and ongoing cost to implement), <strong>Feasibility</strong> (can you actually do this given ownership, approvals, skills and disruption to operations), and <strong>Time</strong> (how long from decision to measurable effect). A high-impact action that scores badly on cost, feasibility and time may still rank below a moderate-impact action that your organisation can actually deliver next quarter. That is a feature of the method, not a flaw in it.</p>` }
  ],
  workedExample: `<p>For Greenfield Training Centre, the facilities manager generated a shortlist of possible interventions: an LED lighting upgrade, air-conditioning (HVAC) optimisation, rooftop solar PV, fleet rationalisation, renewable electricity procurement and a business-travel policy. Rather than simply ranking these by which saves the most carbon, she scored three of them across all four dimensions:</p>
    <table>
      <tr><th>Action</th><th>Carbon impact</th><th>Cost</th><th>Ease</th><th>Time</th><th>Priority</th></tr>
      <tr><td>Optimise HVAC settings and schedule</td><td>Medium</td><td>Low</td><td>High</td><td>Short</td><td><span class="priority-High">High</span></td></tr>
      <tr><td>Rooftop solar PV</td><td>High</td><td>High</td><td>Medium</td><td>Medium</td><td><span class="priority-High">High</span></td></tr>
      <tr><td>Replace entire vehicle fleet</td><td>High</td><td>Very high</td><td>Low</td><td>Long</td><td><span class="priority-Medium">Medium</span></td></tr>
    </table>
    <p>Notice that replacing the entire fleet has the same carbon-impact rating as solar, but its very high cost, low feasibility and long timeline pull its overall priority down. HVAC optimisation, despite only a medium carbon impact, comes out as a genuine near-term priority because it is cheap, easy and fast. This is precisely why the matrix scores four dimensions rather than ranking by carbon impact alone.</p>`,
  guidedActivityIntro: `<p>Generate five to eight possible reduction measures for your own organisation, informed by the hotspots your Module 2 baseline revealed. Score each one, then select your three priority actions using the checkboxes. Three prefilled example rows are there to get you started &mdash; edit or delete them freely.</p>`,
  tool: "actions",
  criticalThinking: {
    prompt: "“Install solar panels immediately.”",
    question: "It sounds decisive, and solar is genuinely popular for good reason. Is it necessarily your organisation's best first action?",
    quiz: { question: "What does the right answer actually depend on?",
      options: [
        { text: "Nothing in particular. Solar is always the correct first move for any organisation serious about net zero.", correct:false, feedback: "This is the trap the question is designed to expose. Solar can be an excellent action, but &ldquo;always correct regardless of circumstances&rdquo; is exactly the kind of thinking a proper prioritisation matrix is built to prevent." },
        { text: "It depends on the baseline, whether the organisation owns the building and roof, available roof area, the electricity consumption profile, cost, and what other efficiency opportunities are competing for the same budget.", correct:true, feedback: "Correct. An organisation that leases its premises may not be able to install solar at all. One with a small roof and a large electricity load may only offset a fraction of consumption. One that has not yet fixed a leaking HVAC system may be paying to generate power it is currently wasting. None of this makes solar a bad idea. It makes it one option to be scored fairly against the others, not an automatic first move." },
        { text: "It depends only on how much carbon the panels would offset.", correct:false, feedback: "Carbon offset potential is one input, and often a strong one for solar, but cost, feasibility, building ownership and competing priorities all affect whether it is genuinely the best first action for a specific organisation right now." }
      ] }
  },
  selfCheck: [
    { question: "An action has the highest carbon-impact score of anything on your list, but also the highest cost, lowest feasibility and longest timeline. What should happen to it in your prioritisation matrix?",
      options: [
        { text: "It should automatically be selected as a priority action, because carbon impact is what matters most.", correct:false, feedback: "Carbon impact matters, but it is only one of four dimensions the matrix deliberately scores together. An action nobody can actually deliver does not reduce any emissions at all, however large it looks on paper." },
        { text: "Its overall priority score should be pulled down by the cost, feasibility and time scores, even though its impact is high, and it may still be worth keeping on a longer-term list.", correct:true, feedback: "Correct. This is exactly what the weighted scoring is designed to do. A high-impact, low-feasibility action often belongs in your roadmap's &ldquo;longer-term direction&rdquo; section in Module 4, rather than as one of your three near-term priority actions." },
        { text: "It should be removed from the list entirely, since it clearly is not going to happen.", correct:false, feedback: "Not necessarily removed, just not prioritised for immediate action. It is still useful information for the longer-term direction section of your Module 4 roadmap, so it is usually better to keep it visible rather than deleting it." }
      ] }
  ],
  reflection: { prompts: [
    "Which action ranked lower than you initially expected once cost, feasibility and time were factored in, and why?",
    "If one constraint in your organisation changed, such as gaining ownership of your building or a larger budget, which action would move up your priority list?"
  ]},
  output: { title: "Three Priority Carbon-Reduction Actions", description: "For each of your three selected actions: estimated carbon benefit, indicative cost, approximate implementation period, and the rationale behind choosing it now rather than later. These carry forward directly into your Module 4 roadmap." }
});

/* ============================================================
   MODULE 4 CONTENT — Build Your Net-Zero Roadmap
   ============================================================ */
courseData.modules.push({
  id: "m4", number: 4, title: "Build Your Net-Zero Roadmap", slt: "4.5 hours",
  drivingQuestion: "How do we turn analysis into an actionable pathway?",
  outcome: "synthesise your baseline and selected actions into a one-page net-zero roadmap.",
  keyConcepts: "near-term action, medium-term action, long-term transition, target-setting, responsibility, milestones, monitoring and review.",
  scenario: {
    quote: `Consider two plans a facilities manager could bring to management.<br><br>
      <strong>Plan A:</strong> &ldquo;Reduce carbon emissions. Install solar. Encourage recycling. Become net zero by 2040.&rdquo;<br><br>
      <strong>Plan B:</strong> A baseline figure, quantified priorities, dates, owners, costs and indicators.`,
    note: "Which plan could management actually act on next Monday morning? Plan A is not wrong, exactly, but there is nothing in it anyone could put in a calendar, a budget line or a job description. Everything you have built across the last three modules exists to make sure your plan looks like Plan B."
  },
  concepts: [
    { heading: "Near-term, medium-term and long-term action",
      body: `<p>A credible roadmap sequences actions across time rather than listing them as one undifferentiated pile. <strong>Near-term actions</strong> are the three priority actions from Module 3, things you can begin within roughly the next few months. <strong>Medium-term actions</strong> are the ones that scored well on impact but need more lead time, budget cycles or approvals. <strong>Long-term transition</strong> covers the structural shifts, such as fleet electrification or a full renewable electricity contract, that depend on near-term actions succeeding first, or on external factors like available financing or grid infrastructure maturing.</p>` },
    { heading: "Target-setting, responsibility and milestones",
      body: `<p>A roadmap that says &ldquo;net zero by 2040&rdquo; without anything in between is a slogan, not a plan. Effective target-setting breaks a long-term ambition into <strong>milestones</strong> your organisation can check itself against well before the final date, each ideally with a named <strong>owner</strong>, someone in your organisation whose job includes making sure it actually happens. Responsibility that sits with &ldquo;the organisation&rdquo; in the abstract tends to sit with nobody in practice.</p>` },
    { heading: "Monitoring and review are part of the plan, not an afterthought",
      body: `<p>A roadmap without a review point is a plan you write once and forget. Choosing two to four <strong>monitoring indicators</strong>, simple, trackable measures such as monthly electricity use, litres of fuel purchased, or percentage of waste diverted from landfill, and setting a specific <strong>review point</strong>, such as a date or a recurring management meeting, turns your roadmap into something that stays alive after this course ends.</p>` }
  ],
  workedExample: `<p>Here is Greenfield Training Centre's completed one-page roadmap, built directly from the baseline and prioritisation work in the previous two modules.</p>
    <table>
      <tr><th style="width:28%;">Element</th><th>Greenfield's entry</th></tr>
      <tr><td>Baseline</td><td>77.02 tCO2e (year 1)</td></tr>
      <tr><td>Hotspots</td><td>Grid electricity (62.90 t, ~82%), petrol (4.98 t), waste (3.60 t)</td></tr>
      <tr><td>Priority Action 1</td><td>Optimise HVAC settings and schedule &mdash; medium impact, low cost, 6&ndash;8 weeks</td></tr>
      <tr><td>Priority Action 2</td><td>Rooftop solar PV (phase 1, main roof) &mdash; high impact, high cost (RM 180,000 estimated), 4&ndash;6 months including approvals</td></tr>
      <tr><td>Priority Action 3</td><td>LED lighting upgrade across both buildings &mdash; medium impact, low cost, 4&ndash;6 weeks</td></tr>
      <tr><td>Longer-term direction</td><td>Renewable electricity procurement for any residual grid demand once solar is operational; phased replacement of minibuses with electric or hybrid models at next fleet renewal</td></tr>
      <tr><td>Monitoring</td><td>Monthly kWh from utility bills; monthly litres of petrol and diesel purchased; quarterly waste tonnage from contractor; annual re-run of full baseline</td></tr>
      <tr><td>Review point</td><td>Next full management review, Q1 of the following year</td></tr>
    </table>
    <p>Notice this is still one page. Nothing here required sophisticated modelling. What makes it credible is that every line traces back to a number or a decision made earlier in the course, not to an aspiration invented on the spot.</p>`,
  guidedActivityIntro: `<p>The roadmap builder below automatically pulls in your baseline total and top hotspots from Module 2, and the three priority actions you selected in Module 3. Fill in indicative cost and timeline for each action, then complete the longer-term direction, monitoring indicators and review point to finish your one-page roadmap. Use the print button to save or export it once you are happy with it.</p>`,
  tool: "roadmap",
  selfCheck: [
    { question: "Looking back at Plan A and Plan B at the top of this module, what is the single biggest practical difference between them?",
      options: [
        { text: "Plan B is longer and uses more technical language.", correct:false, feedback: "Length and jargon are not the point, and a needlessly long or jargon-heavy plan is not automatically better. The real difference is about specificity, not word count." },
        { text: "Plan B contains a quantified baseline, named priorities, costs, dates and indicators, so someone could act on it immediately, whereas Plan A contains only intentions.", correct:true, feedback: "Correct. That is precisely why this course front-loads the baseline and prioritisation work before asking you to write anything resembling a roadmap. A roadmap is only as strong as the analysis underneath it." },
        { text: "Plan A is more ambitious because it names a net-zero date.", correct:false, feedback: "A stated date can be part of ambition, but ambition without a route to get there is not the same as a plan. Plan B could easily include a target date too, alongside the specifics that make it achievable." }
      ] }
  ],
  reflection: { prompts: [
    "If you were presenting this roadmap to your management team next week, what is the first decision you would ask them to make?",
    "Who in your organisation would need to own each of your three priority actions for them to actually happen, and have you named them yet?"
  ]},
  output: { title: "One-Page Net-Zero Roadmap", description: "A single page containing your baseline figure, main hotspots, three priority actions with impact, cost and timeline, your longer-term direction, two to four monitoring indicators, and a specific review point. This is the final assessed artefact for the course." }
});

/* ============================================================
   COURSE COMPLETION — final rubric self-check
   ============================================================ */
function renderCompletion(){
  markProgress("complete");
  const rubricRows = courseData.rubric.map((r, i) => {
    const id = "rubric-" + i;
    const val = state.rubricSelf[id];
    return `<div class="rubric-row">
      <div><strong>${esc(r.criterion)}</strong></div>
      <div class="field hint" style="margin:0;">${esc(r.good)}</div>
      <div class="rubric-toggle">
        <button class="${val==="Achieved"?"sel-achieved":""}" onclick="state.rubricSelf['${id}']='Achieved'; render();">Achieved</button>
        <button class="${val==="Revise"?"sel-revise":""}" onclick="state.rubricSelf['${id}']='Revise'; render();">Needs revision</button>
      </div>
    </div>`;
  }).join("");

  const baselineTotal = state.baseline.rows.reduce((sum,r) => sum + baselineRowEmissions(r), 0);
  const selectedActions = state.actions.rows.filter(a => state.actions.selectedIds.includes(a.id));

  return `
  <div class="eyebrow">Course completion</div>
  <h1>You have built a net-zero pathway</h1>
  <p>Four weeks ago the honest answer to &ldquo;what exactly are our emissions today?&rdquo; may well have been a shrug. You now have a boundary map, a baseline figure with its assumptions laid out, a scored list of reduction options and a one-page roadmap that names actions, costs, timelines and a review point. That is a genuinely different starting position for a conversation with management.</p>

  ${renderJourneyMap(4)}

  <h2>Your work at a glance</h2>
  <table>
    <tr><th>Artefact</th><th>Status</th></tr>
    <tr><td>Organisation Carbon Boundary Map</td><td>${state.boundary.orgName ? "Drafted for " + esc(state.boundary.orgName) : "Not yet started"}</td></tr>
    <tr><td>Baseline Carbon Footprint</td><td>${baselineTotal>0 ? fmt(baselineTotal,2)+" tCO2e estimated" : "Not yet calculated"}</td></tr>
    <tr><td>Carbon Action Prioritisation Matrix</td><td>${selectedActions.length ? selectedActions.length + " priority action(s) selected" : "Not yet selected"}</td></tr>
    <tr><td>One-Page Net-Zero Roadmap</td><td>${state.roadmap.reviewPoint ? "Review point set: " + esc(state.roadmap.reviewPoint) : "Roadmap in progress"}</td></tr>
  </table>

  <div class="btn-row">
    <button class="btn secondary" onclick="navigateTo('m4')">&larr; Open my roadmap again</button>
  </div>

  <h2>Final self-check against the roadmap rubric</h2>
  <p>This CPD course uses a simple <strong>Achieved / Needs Revision</strong> model rather than fine-grained numerical grading. Be honest with yourself here &mdash; the point is a roadmap you can actually use, not a perfect score.</p>
  <div class="card">${rubricRows}</div>

  <h2>Where this goes next</h2>
  <p>The roadmap you have built is a first pathway, not a finished carbon-management system. Treat it as something to bring to your management team, refine with better data over time, and revisit at the review point you set. Purchased goods and services, the hardest category to quantify well, is a natural next area to develop once this first cycle is embedded.</p>

  <div class="callout good">
    <strong>A closing thought</strong>
    <p style="margin:.6em 0 0;">If you were presenting this roadmap to your management team next week, what is the first decision you would ask them to make? That question, more than any grade, is the real test of whether this course has done its job.</p>
  </div>

  ${renderCourseFooter()}
  `;
}

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
</body>
</html>
